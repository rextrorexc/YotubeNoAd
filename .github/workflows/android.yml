name: Android APK

on:
  push:
    tags: ["apk-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Imza anahtarini hazirla
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "Imza anahtari yok, debug anahtari kullanilacak"
          fi

      - name: Derle
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: APK dosyasini hazirla
        run: cp android/app/build/outputs/apk/release/app-release.apk YotubeNoAd.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YotubeNoAd-apk
          path: YotubeNoAd.apk

      - name: Surume yukle
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" YotubeNoAd.apk \
            --title "Android ${GITHUB_REF_NAME#apk-v}" \
            --notes "YotubeNoAd Android uygulamasi. APK dosyasini indirip kurun."
